[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surrogate-reliability"
version = "0.1.0"
description = "Reliability utilities for small-data engineering surrogates."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
regression = ["statsmodels>=0.14,<0.15", "pandas>=2.2,<3", "matplotlib>=3.9", "openpyxl>=3.1"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
